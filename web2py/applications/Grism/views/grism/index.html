<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Grism</title>

    <meta name="description" content="Source code generated using layoutit.com">
    <meta name="author" content="LayoutIt!">

    <link href="{{=URL('static', 'css/bootstrap.min.css')}}" rel="stylesheet">
    <link href="{{=URL('static', 'css/style.css')}}" rel="stylesheet">
</head>
<body>

<div class="container">
    <div class="row">
        <div class="col-md-10">
            <img alt="Bootstrap Image Preview" src="{{=URL('static', 'images/grism.png')}}"/>
            <br/><br/><br/>

            <form id="login_form" class="form-horizontal" role="form">
                <div class="form-group">

                    <label for="user_name" class="col-sm-2 control-label">
                        User Name
                    </label>

                    <div class="col-sm-10">
                        <input type="email" class="form-control" id="user_name">
                    </div>
                </div>
                <div class="form-group">

                    <label for="inputPassword3" class="col-sm-2 control-label">
                        Password
                    </label>

                    <div class="col-sm-10">
                        <input type="password" class="form-control" id="inputPassword">
                    </div>
                </div>
                <div class="form-group">
                    <div class="col-sm-offset-2 col-sm-10">

                        <button type="button" class="btn btn-default btn-primary" onclick="proc_login()">
                            Sign in
                        </button>
                    </div>
                </div>
            </form>
            <address>
                <strong>PacketX Technology, Inc.</strong><br/> 14F.-6, No.490, Jingping Rd., Zhonghe Dist., New Taipei City <br/> 23582, Taiwan (R.O.C.)<br/>
                <abbr title="Phone">P:</abbr> 02-22486718
            </address>
        </div>
    </div>
</div>

<script src="{{=URL('static', 'js/jquery.min.js')}}"></script>
<script src="{{=URL('static', 'js/bootstrap.min.js')}}"></script>
<script src="{{=URL('static', 'js/scripts.js')}}"></script>

<script>

    proc_login = function () {

        var user_name = $('#user_name').val();
        var inputPassword = $('#inputPassword').val();
        $.ajax({
            url: '/proc_login',
            data: {
                is_ajax: true, user_name: user_name, password: inputPassword,
                rnd: new Date().getTime()
            },
            dataType: 'json',
            type: 'POST',
            success: function (result) {
                if (result.error == 0) {
                    window.location.href = '/console';
                } else {
                    alert(result.message)
                }
            }
        });
    };

</script>

</body>
</html>
