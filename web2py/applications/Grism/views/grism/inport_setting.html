<div id='inport_setting' class="form-group" style="display: none">
    <div class="dropdown">
        <button id="port_num" class="btn btn-default dropdown-toggle" type="button" data-toggle="dropdown"
                aria-haspopup="true"
                aria-expanded="true">
            Select Port
            <span class="caret"></span>
        </button>
        <ul class="dropdown-menu">
            <!-- dropdown menu links -->
            <li id="P0"><a>P0</a></li>
            <li id="P1"><a>P1</a></li>
            <li id="P2"><a>P2</a></li>
            <li id="P3"><a>P3</a></li>
            <li id="P4"><a>P4</a></li>
            <li id="P5"><a>P5</a></li>
            <li id="P6"><a>P6</a></li>
            <li id="P7"><a>P7</a></li>
        </ul>
    </div>

    <h4>pre-service:</h4>

    <div class="checkbox">
        <form class="form-inline">
            <div class="form-group"><label><input type="checkbox" value="1">vlan tagging</label></div>
            <div class="form-group">
                <input type="text"
                       class="form-control" id="vlan_tag" style="width: 100px"></div>
        </form>
    </div>
    <div class="checkbox">
        <label><input type="checkbox" value="2">vlan stripping</label>
    </div>
    <div class="checkbox">
        <label><input type="checkbox" value="3">mpls stripping</label>
    </div>
    <div class="checkbox">
        <label><input type="checkbox" value="4">TCP/UDP payload
            stripping</label>
    </div>
    <div class="checkbox">
        <form class="form-inline">
            <div class="form-group"><label><input type="checkbox" value="5">packet stripping</label></div>
            <div class="form-group">
                <input type="text"
                       class="form-control" id="packet" style="width: 100px"></div>
        </form>
    </div>
    <!--
    <div id="dir_setting" class="checkbox disabled" style="display: none">
        <form class="form-inline">
            <div class="form-group"><label><input type="checkbox" value="6">directory (bytes)</label></div>
            <div class="form-group">
                <input type="text"
                       class="form-control" id="directory" style="width: 100px"></div>
        </form>
    </div>
    -->
    <button type="button" class="btn btn-primary btn-sm pull-right"
            onclick="add_port_setting('inport_setting')">
        done
    </button>
    <button type="button" class="btn btn-primary btn-sm pull-right"
            onclick="show_setting('filter_in')">
        cancel
    </button>
</div>
